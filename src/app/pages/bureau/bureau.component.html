<section id="bureau" class="py-16 bg-gray-50">
  <div class="container mx-auto px-4">
    <h2 class="text-2xl sm:text-3xl font-bold text-center mb-10 text-blue-800">Bureau Exécutif de l'UNESST</h2>

    <div class="max-w-7xl mx-auto relative">
      <!-- Bouton gauche -->
      <button (click)="scrollLeft1()" class="flex absolute  absolute left-2 top-1/2 transform -translate-y-1/2 z-10 bg-blue-800 text-white p-2 sm:p-3 rounded-full shadow hover:bg-blue-700">
        <i class="fas fa-chevron-left text-sm sm:text-base"></i>
      </button>

      <!-- Carrousel horizontal -->
      <div #carousel class="flex overflow-x-auto space-x-4 sm:space-x-6 scroll-smooth pb-4 px-2 sm:px-10">
        <div *ngFor="let membre of bureau" class="w-[80vw] sm:w-[300px] flex-shrink-0 bg-white rounded-lg shadow-md hover:shadow-lg transition duration-300">
          <div class="h-48 sm:h-64 bg-gray-200">
            <img [src]="membre.photo" [alt]="membre.nom" class="h-full w-full object-cover rounded-t-lg">
          </div>
          <div class="p-4 text-center">
            <h3 class="text-lg sm:text-xl font-bold">{{ membre.nom }}</h3>
            <p class="text-blue-600 font-medium text-sm sm:text-base">{{ membre.poste }}</p>
            <p class="text-gray-600 text-xs sm:text-sm mb-2">{{ membre.description }}</p>
            <div class="flex justify-center space-x-3 text-base">
              <a *ngIf="membre.facebook" [href]="membre.facebook" target="_blank" class="text-blue-500 hover:text-blue-700"><i class="fab fa-facebook-f"></i></a>
              <a *ngIf="membre.twitter" [href]="membre.twitter" target="_blank" class="text-blue-400 hover:text-blue-600"><i class="fab fa-twitter"></i></a>
              <a *ngIf="membre.instagram" [href]="membre.instagram" target="_blank" class="text-red-500 hover:text-red-700"><i class="fab fa-instagram"></i></a>
              <a *ngIf="membre.linkedin" [href]="membre.linkedin" target="_blank" class="text-blue-700 hover:text-blue-900"><i class="fab fa-linkedin-in"></i></a>
            </div>
          </div>
        </div>
      </div>

      <!-- Bouton droit -->
      <button (click)="scrollRight1()" class="flex absolute  absolute right-2 top-1/2 transform -translate-y-1/2 z-10 bg-blue-800 text-white p-2 sm:p-3 rounded-full shadow hover:bg-blue-700">
        <i class="fas fa-chevron-right text-sm sm:text-base"></i>
      </button>
    </div>
  </div>
</section>


<section class="py-16 bg-blue-800 text-white">
  <div class="container mx-auto px-4">
    <h2 class="text-2xl sm:text-3xl font-bold text-center mb-12">Témoignages d'anciens étudiants</h2>

    <div class="max-w-7xl mx-auto relative">
      <!-- Bouton gauche -->
      <button class="hidden sm:flex absolute left-2 top-1/2 transform -translate-y-1/2 z-10 bg-blue-700 text-white p-2 rounded-full shadow-md" (click)="scrollLeft()">
        <i class="fas fa-chevron-left"></i>
      </button>

      <!-- Conteneur scrollable -->
      <div #testimonialContainer class="flex overflow-x-auto gap-4 scroll-smooth pb-4 px-2 sm:px-10">
        <div *ngFor="let t of testimonials" class="w-[80vw] sm:w-[320px] flex-shrink-0 bg-blue-700 rounded-lg p-4 sm:p-6">
          <div class="flex items-center mb-4">
            <img [src]="t.image" [alt]="t.nom" class="w-12 h-12 rounded-full mr-4">
            <div>
              <h4 class="font-bold">{{ t.nom }}</h4>
              <p class="text-blue-200 text-sm">{{ t.promo }}</p>
            </div>
          </div>
          <div class="flex mb-2">
            <i *ngFor="let star of [1,2,3,4,5]; let i = index" class="fas" [ngClass]="i < t.stars ? 'fa-star text-yellow-300' : 'fa-star text-gray-400'"></i>
          </div>
          <p class="mb-4 text-sm">"{{ t.texte }}"</p>
          <div class="flex items-center text-blue-200 text-sm">
            <i class="fas fa-graduation-cap mr-2"></i>
            <span>{{ t.role }}</span>
          </div>
        </div>
      </div>

      <!-- Bouton droit -->
      <button class="hidden sm:flex absolute right-2 top-1/2 transform -translate-y-1/2 z-10 bg-blue-700 text-white p-2 rounded-full shadow-md" (click)="scrollRight()">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>
  </div>
</section>
