


<header class="bg-white shadow sticky top-0 z-50">
  <div class="container mx-auto px-4 py-3 flex justify-between items-center">
    <!-- Logo -->
    <div class="flex items-center space-x-3">
      <img src="assets/images/logolast.png" alt="Logo UNESST" class="h-12">
      <div>
        <h1 class="text-xl font-bold text-blue-800">UNESST</h1>
        <p class="text-xs text-gray-600">Union des Étudiants et Stagiaires Sénégalais en Tunisie</p>
      </div>
    </div>

    <!-- Navigation desktop -->
    <nav class="hidden md:flex items-center space-x-6">
      <a href="#" routerLink="/unesst-web" routerLinkActive="active-nav" class="text-gray-700 hover:text-blue-700 font-medium">Accueil</a>

      <!-- Menu déroulant Services -->
      <!-- Container général qui garde le menu ouvert tant que la souris est sur l’un des deux éléments -->
    <div class="relative" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">
      <button class="text-gray-700 hover:text-blue-700 font-medium focus:outline-none">
        Services <i class="fas fa-chevron-down ml-1 text-sm"></i>
      </button>

      <div
        class="absolute bg-white shadow-lg mt-2 rounded-md w-56 z-50"
        *ngIf="showDropdown"
      >
        <a href="#documents" routerLink="/documents" routerLinkActive="active-nav" class="block px-4 py-2 hover:bg-blue-50 text-gray-700">Documents utiles</a>
        <a href="#vie-tunisie" routerLink="/vie-tunisie" routerLinkActive="active-nav" class="block px-4 py-2 hover:bg-blue-50 text-gray-700">Vie en Tunisie</a>
        <a href="/membership" routerLink="/membership" routerLinkActive="active-nav" class="block px-4 py-2 hover:bg-blue-50 text-gray-700">Adhésion</a>
      </div>
    </div>


      <a href="#activites" routerLink="/activites" routerLinkActive="active-nav" class="text-gray-700 hover:text-blue-700 font-medium">Activités</a>
      <a href="#bureau" routerLink="/bureau" routerLinkActive="active-nav" class="text-gray-700 hover:text-blue-700 font-medium">Bureau</a>
      <a href="#contact" routerLink="/contact" routerLinkActive="active-nav" class="text-gray-700 hover:text-blue-700 font-medium">Contact</a>
    </nav>

    <!-- Bouton menu mobile -->
    <div class="md:hidden">
      <button (click)="toggleMobileMenu()" class="text-gray-700">
        <i class="fas fa-bars text-2xl"></i>
      </button>
    </div>
  </div>

  <!-- Menu mobile -->
  <div [ngClass]="{'hidden': !isMobileMenuOpen}" class="md:hidden bg-white py-2 px-4 shadow-lg">
    <a  href="#" (click)="closeMobileMenu()" routerLink="/unesst-web" routerLinkActive="active-nav" class="block py-2 text-gray-700">Accueil</a>
    <div class="py-2">
      <span class="block text-gray-700 font-semibold">Services</span>
      <a href="#documents" (click)="closeMobileMenu()" routerLink="/documents" routerLinkActive="active-nav" class="block py-1 pl-4 text-gray-600">Documents utiles</a>
      <a href="#vie-tunisie" (click)="closeMobileMenu()" routerLink="/vie-tunisie" routerLinkActive="active-nav" class="block py-1 pl-4 text-gray-600">Vie en Tunisie</a>
      <a href="/membership" (click)="closeMobileMenu()" routerLink="/membership" routerLinkActive="active-nav" class="block py-1 pl-4 text-gray-600">Adhésion</a>
    </div>
    <a href="#activites" (click)="closeMobileMenu()" routerLink="/activites" routerLinkActive="active-nav" class="block py-2 text-gray-700">Activités</a>
    <a href="#bureau" (click)="closeMobileMenu()" routerLink="/bureau" routerLinkActive="active-nav" class="block py-2 text-gray-700">Bureau</a>
    <a href="#contact" (click)="closeMobileMenu()" routerLink="/contact" routerLinkActive="active-nav" class="block py-2 text-gray-700">Contact</a>
  </div>
</header>
